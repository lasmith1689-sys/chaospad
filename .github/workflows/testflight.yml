name: TestFlight

# My personal ChaosPad: Splinter Cell Chaos Theory (USA) as native iPhone code: the ps2-native-recomp runtime (MIT, vendored
# in runtime/ with my iOS port) with the game's EE code and VU1 microprograms compiled to C++ from my own disc on my PC.
# Built on GitHub's Mac runner, signed with Apple's cloud signing and uploaded to TestFlight for internal testing only.
# The game input arrives encrypted (release game-input / chaospad-input.tar.enc, key in the GAME_KEY secret) and is
# decrypted only inside the runner; nothing derived from it is cached. The disc image goes to the phone as an Apple-hosted
# asset pack (mode assetpacks; encrypted chunks in release disc-input).
#
# mode: simulator   builds for the iOS Simulator and runs the app there (with the disc: it boots as far as it gets alone)
#       testflight  builds for the device and uploads it
#       assetpacks  packages the disc image as the asset pack sc3disc and uploads it
on:
  workflow_dispatch:
    inputs:
      mode:
        description: simulator, testflight or assetpacks
        type: choice
        options: [simulator, testflight, assetpacks]
        default: simulator
      disc:
        description: simulator mode only, put the disc image into the app (download and decrypt 3.7 GB)
        type: boolean
        default: true

concurrency:
  group: testflight-${{ inputs.mode }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  CHAOSPAD_BUNDLE_ID: com.lasmith1689.chaospad
  CHAOSPAD_APPLE_ID: '6832349033'
  # the app group of the app and its downloader extension: GoWPad's for now (it exists; group.com.lasmith1689.chaospad does not yet)
  CHAOSPAD_APP_GROUP: group.com.lasmith1689.gowpad
  # 0 until the app group is assigned to the App IDs on the developer site (cloud signing cannot do that): no downloader extension,
  # the disc comes from the app's folder in the Files app
  CHAOSPAD_ASSET_PACKS: '0'

jobs:
  assetpacks:
    name: Asset pack
    if: inputs.mode == 'assetpacks'
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pick the newest Xcode and free disk space
        run: |
          xcode=$(for x in /Applications/Xcode_*.app; do [ -L "$x" ] || echo "$x"; done | sort -V | tail -n 1)
          xcode=$(cd "$xcode" && pwd -P)
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $xcode"
          for other in /Applications/Xcode*.app; do
            [ -L "$other" ] && continue
            [ "$(cd "$other" && pwd -P)" = "$xcode" ] || sudo rm -rf "$other" &
          done
          sudo rm -rf "${ANDROID_HOME:-/nonexistent}" "$HOME/.dotnet" /usr/local/share/dotnet &
          wait
          df -h /
      - name: Package and upload the asset pack
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_KEY: ${{ secrets.GAME_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: bash .github/scripts/asset-packs.sh "$RUNNER_TEMP/packs"
      - name: Remove the decrypted disc data
        if: always()
        run: rm -rf "$RUNNER_TEMP/packs"

  build:
    name: Build (${{ inputs.mode }})
    if: inputs.mode != 'assetpacks'
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pick the newest Xcode and free disk space
        run: |
          xcode=$(for x in /Applications/Xcode_*.app; do [ -L "$x" ] || echo "$x"; done | sort -V | tail -n 1)
          xcode=$(cd "$xcode" && pwd -P)
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $xcode"
          for other in /Applications/Xcode*.app; do
            [ -L "$other" ] && continue
            [ "$(cd "$other" && pwd -P)" = "$xcode" ] || sudo rm -rf "$other" &
          done
          sudo rm -rf "${ANDROID_HOME:-/nonexistent}" "$HOME/.dotnet" /usr/local/share/dotnet &
          wait
          df -h /
      - name: Install build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sysctl -n hw.ncpu hw.memsize
          brew install cmake ninja
      - name: Decrypt my game input inside the runner
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_KEY: ${{ secrets.GAME_KEY }}
        run: |
          [ -n "$GAME_KEY" ] || { echo "::error::Add the GAME_KEY secret first."; exit 1; }
          mkdir -p "$RUNNER_TEMP/input"
          gh release download game-input -R "$GITHUB_REPOSITORY" -p chaospad-input.tar.enc -D "$RUNNER_TEMP/input"
          /opt/homebrew/opt/openssl@3/bin/openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 \
            -pass env:GAME_KEY -in "$RUNNER_TEMP/input/chaospad-input.tar.enc" -out "$RUNNER_TEMP/input/input.tar"
          tar -xf "$RUNNER_TEMP/input/input.tar" -C "$RUNNER_TEMP/input"
          rm -f "$RUNNER_TEMP/input/chaospad-input.tar.enc" "$RUNNER_TEMP/input/input.tar"
          ls -la "$RUNNER_TEMP/input"
      - name: Build the app
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: |
          target=device
          [ "${{ inputs.mode }}" = simulator ] && target=simulator
          bash .github/scripts/build-ios.sh "$RUNNER_TEMP/input" "$RUNNER_TEMP/work" "$target"
      - name: Decrypt the disc image for the simulator
        if: inputs.mode == 'simulator' && inputs.disc
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_KEY: ${{ secrets.GAME_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/disc" && cd "$RUNNER_TEMP/disc"
          for chunk in $(gh release view disc-input -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name | select(startswith("sc3.sparse.part"))' | sort); do
            gh release download disc-input -R "$GITHUB_REPOSITORY" -p "$chunk" -D . --clobber
            /opt/homebrew/opt/openssl@3/bin/openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 -pass env:GAME_KEY -in "$chunk" >> sc3.sparse
            rm -f "$chunk"
          done
          ls -la
          df -h /
      - name: Run it in the iOS Simulator
        if: inputs.mode == 'simulator'
        timeout-minutes: 20
        env:
          DISC_DIR: ${{ runner.temp }}/disc
        run: bash .github/scripts/simulator-check.sh "$RUNNER_TEMP/work/ChaosPad.app" "$RUNNER_TEMP/simcheck"
      - name: Keep the simulator screenshots, log and sample (one day)
        if: inputs.mode == 'simulator' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simulator-check
          path: |
            ${{ runner.temp }}/simcheck/*.png
            ${{ runner.temp }}/simcheck/*.txt
            ${{ runner.temp }}/simcheck/*.ips
          retention-days: 1
          if-no-files-found: ignore
      - name: Sign and upload
        if: inputs.mode == 'testflight'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        # (the build number: run x 10 + attempt, growing with every upload and every re-run)
        run: BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT)) bash .github/scripts/testflight.sh "$RUNNER_TEMP/work/ChaosPad.app"
      - name: Remove the game input and everything built from it
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/input" "$RUNNER_TEMP/work" "$RUNNER_TEMP/testflight" "$RUNNER_TEMP/simcheck" "$RUNNER_TEMP/disc"
          df -h /
